[project]
name = "bella-melissa-ineza-rl-summative"
version = "0.1.0"
description = "RL Summative: Restocking agent for rural health clinic medicine supply"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gymnasium>=0.29.1",
    "stable-baselines3[extra]>=2.3.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "pygame>=2.5.2",
    "tensorboard>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training"]

